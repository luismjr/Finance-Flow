finance_flow:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: finance
      password: finance
      port: 5432
      dbname: financeflow
      schema: public
      threads: 4

    bigquery:
      type: bigquery
      method: service-account
      project: "{{ env_var('BIGQUERY_PROJECT_ID', '') }}"
      dataset: "{{ env_var('BIGQUERY_DATASET_ID', 'financeflow') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      threads: 4
